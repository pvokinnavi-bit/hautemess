<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Микстейп — HAUTE MESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1A1A1A;
            font-family: 'Arial Black', 'Arial', sans-serif;
        }

        .page {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #7F7F7F;
            text-decoration: none;
            margin-bottom: 40px;
            transition: opacity 0.3s;
            font-family: 'Courier Prime', monospace;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        h1 {
            font-size: 80px;
            color: #F5F5F0;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
            letter-spacing: -0.02em;
        }

        .description {
            font-family: 'Courier Prime', monospace;
            font-size: 16px;
            color: #7F7F7F;
            margin-bottom: 30px;
        }

        /* КЛИКАБЕЛЬНЫЕ ТРЕКИ – как ссылки */
        .track-list {
            margin-bottom: 50px;
        }

        .track {
            background: #2A2A2A;
            margin: 12px 0;
            padding: 15px 20px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .track a {
            text-decoration: none;
            color: #F5F5F0;
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .track:hover {
            background: #3A3A3A;
            transform: translateX(5px);
        }

        /* Плеер */
        .yandex-player {
            margin: 30px 0;
            background: #2A2A2A;
            border-radius: 24px;
            padding: 10px;
            overflow: hidden;
        }

        iframe {
            border-radius: 16px;
            width: 100%;
        }

        @media (max-width: 700px) {
            h1 { font-size: 48px; }
            .track { justify-content: center; }
            .yandex-player { padding: 5px; }
        }
    </style>
</head>
<body>
<div class="page">
    <a href="index.html" class="back-link">
        ← НА ГЛАВНУЮ
    </a>

    <h1>МИКСТЕЙП ДНЯ</h1>
    <div class="description">
        🎧 Главные треки, которые звучат внутри HAUTE MESS. Листай вниз – там целый плейлист.
    </div>

    <!-- КЛИКАБЕЛЬНЫЙ СПИСОК ТРЕКОВ (отдельные ссылки на Яндекс.Музыку) -->
    <div class="track-list">
        <div class="track">
            <a href="https://music.yandex.ru/iframe/album/41902110/track/150987138" target="_blank" rel="noopener noreferrer">
                🎧 CORTIS - REDRED
            </a>
        </div>
        <div class="track">
            <a href="https://music.yandex.ru/iframe/album/35177777/track/135612836" target="_blank" rel="noopener noreferrer">
                🎧 Malcolm Todd - Earrings
            </a>
        </div>
        <div class="track">
            <a href="https://music.yandex.ru/iframe/album/9694180/track/61875946" target="_blank" rel="noopener noreferrer">
                🎧 Hyukoh - Help
            </a>
        </div>
        <div class="track">
            <a href="https://music.yandex.ru/iframe/album/39366510/track/145494479" target="_blank" rel="noopener noreferrer">
                🎧 KC - KURT COBAIN
            </a>
        </div>
        <div class="track">
            <a href="https://music.yandex.ru/iframe/album/6350669/track/42513915" target="_blank" rel="noopener noreferrer">
                🎧 MIYAVI - Long Nights
            </a>
        </div>
    </div>

    <!-- ОТДЕЛЬНЫЙ ПЛЕЙЛИСТ НА YANDEX MUSIC (с другими треками, но в том же стиле) -->
    <div class="yandex-player">
        <iframe 
            frameborder="0" 
            style="border:none;width:100%;height:380px;" 
            height="380" 
            src="https://music.yandex.ru/iframe/playlist/rg.alioth/1001">
        </iframe>
    </div>
</div>
</body>
</html>
